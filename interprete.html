<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Intérprete - La melodía de π</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    body { background:#0a0c10; color:#eef3f9; font-family:'Inter',sans-serif; text-align:center; padding:20px; }
    video { width:100%; max-width:800px; background:#1a1f2a; border-radius:12px; margin-top:20px; }
    button { margin-top:20px; background:#ffd966; border:none; padding:12px 24px; border-radius:40px; cursor:pointer; font-weight:bold; }
    .status { margin:20px; color:#ffd966; }
  </style>
</head>
<body>
  <h1>🎤 Tu turno en La melodía de π</h1>
  <div id="status" class="status">Verificando tu bloque...</div>
  <video id="localVideo" autoplay muted playsinline></video>
  <button id="btnStart">📹 Activar cámara y micrófono</button>

  <script src="https://cdn.livekit.io/livekit/livekit-latest.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const CODIGO = params.get('code') || params.get('codigo');
    const INICIO_BLOQUE_STR = params.get('inicioBloque');
    if (!CODIGO || !INICIO_BLOQUE_STR) {
      document.getElementById('status').innerHTML = '❌ Enlace inválido.';
      throw new Error('Missing parameters');
    }
    const INICIO_BLOQUE = parseInt(INICIO_BLOQUE_STR);
    const INICIO_MELODIA = new Date(Date.UTC(2027, 2, 14, 0, 0, 0)).getTime();
    function getSegundoGlobal() { return Math.floor((Date.now() - INICIO_MELODIA) / 1000); }
    const ahora = getSegundoGlobal();
    const segundosDesdeInicio = ahora - INICIO_BLOQUE;
    const dentroDelBloque = segundosDesdeInicio >= 0 && segundosDesdeInicio < 600;

    let publicarAudio = false;
    let estado = '';
    if (!dentroDelBloque) {
      estado = '❌ Fuera de tu bloque de 10 minutos. Has perdido tu turno.';
    } else if (segundosDesdeInicio < 300) {
      estado = '⏳ Estás en espera. Te verán en silencio.';
      publicarAudio = false;
    } else {
      estado = '🎤 Estás en directo. ¡Empieza a tocar!';
      publicarAudio = true;
    }
    document.getElementById('status').innerHTML = estado;

    const TOKEN_URL = 'https://orange-sun-a67e.elgrandiyo.workers.dev/';
    const LIVEKIT_URL = 'wss://melodia-pi-3mw6tr42.livekit.cloud';
    const GLOBAL_ROOM = 'melodia-global';

    let room = null;
    let localStream = null;
    let reconnectTimer = null;

    async function solicitarToken(roomName) {
      if (!TOKEN_URL) throw new Error('Token URL no configurada');
      const res = await fetch(`${TOKEN_URL}?room=${roomName}&identity=${CODIGO}`);
      if (!res.ok) throw new Error('Error al obtener token');
      const data = await res.json();
      return data.token;
    }

    async function publicarTracks(roomObj, stream, publicarAudioFlag) {
      const tracks = stream.getTracks();
      const publicaciones = [];
      for (const track of tracks) {
        if (track.kind === 'video') {
          publicaciones.push(roomObj.localParticipant.publishTrack(track));
        } else if (track.kind === 'audio' && publicarAudioFlag) {
          publicaciones.push(roomObj.localParticipant.publishTrack(track));
        }
      }
      await Promise.all(publicaciones);
    }

    async function iniciarTransmision() {
      if (!dentroDelBloque) {
        alert('Estás fuera de tu bloque de 10 minutos. No puedes transmitir.');
        return;
      }
      if (!localStream) {
        try {
          localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
          const videoEl = document.getElementById('localVideo');
          if (videoEl) videoEl.srcObject = localStream;
        } catch(err) {
          document.getElementById('status').innerHTML = '❌ Error al acceder a cámara o micrófono.';
          return;
        }
      }
      try {
        const token = await solicitarToken(GLOBAL_ROOM);
        const newRoom = new Livekit.Room();
        // Configurar eventos de reconexión
        newRoom.on('disconnected', () => {
          console.warn('Desconectado, intentando reconectar...');
          if (reconnectTimer) clearTimeout(reconnectTimer);
          reconnectTimer = setTimeout(() => iniciarTransmision(), 5000);
        });
        await newRoom.connect(LIVEKIT_URL, token);
        room = newRoom;
        await publicarTracks(room, localStream, publicarAudio);
        document.getElementById('status').innerHTML = publicarAudio ?
          '🎙️ Estás al aire. Suenas durante 5 minutos.' :
          '📹 Te están viendo en espera (sin audio).';
        // Si está en espera, monitorear cambio a directo
        if (!publicarAudio) {
          const checkInterval = setInterval(async () => {
            const ahora2 = getSegundoGlobal();
            if (ahora2 >= INICIO_BLOQUE + 300 && ahora2 < INICIO_BLOQUE + 600) {
              // Pasar a directo: publicar audio
              const audioTrack = localStream.getAudioTracks()[0];
              if (audioTrack) {
                await room.localParticipant.publishTrack(audioTrack);
                clearInterval(checkInterval);
                document.getElementById('status').innerHTML = '🎤 Has pasado a directo. ¡Ahora sí te oyen!';
              }
            } else if (ahora2 >= INICIO_BLOQUE + 600) {
              clearInterval(checkInterval);
            }
          }, 1000);
        }
        const tiempoRestante = 600 - segundosDesdeInicio;
        if (tiempoRestante > 0) {
          setTimeout(() => desconectar(), tiempoRestante * 1000);
        }
      } catch(err) {
        console.error(err);
        document.getElementById('status').innerHTML = '❌ Error de conexión. Reintentando...';
        if (reconnectTimer) clearTimeout(reconnectTimer);
        reconnectTimer = setTimeout(() => iniciarTransmision(), 5000);
      }
    }

    async function desconectar() {
      if (room) await room.disconnect();
      room = null;
      document.getElementById('status').innerHTML = 'Conexión finalizada. Gracias por participar.';
    }

    document.getElementById('btnStart').addEventListener('click', iniciarTransmision);
    if (publicarAudio && dentroDelBloque) {
      iniciarTransmision();
    }
  </script>
</body>
</html>
