<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Intérprete - La melodía de π</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    body { background:#0a0c10; color:#eef3f9; font-family:'Inter',sans-serif; text-align:center; padding:20px; }
    video { width:100%; max-width:800px; background:#1a1f2a; border-radius:12px; margin-top:20px; }
    button { margin-top:20px; background:#ffd966; border:none; padding:12px 24px; border-radius:40px; cursor:pointer; font-weight:bold; }
    .status { margin:20px; color:#ffd966; }
  </style>
</head>
<body>
  <h1>🎤 Esperando tu turno...</h1>
  <div id="status" class="status">Verificando turno...</div>
  <video id="localVideo" autoplay muted playsinline></video>
  <button id="btnStart">📹 Activar cámara y micrófono</button>

  <script src="https://cdn.livekit.io/livekit/livekit-latest.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const CODIGO = params.get('code') || params.get('codigo');
    const TURNO_STR = params.get('turno');
    if (!CODIGO || !TURNO_STR) {
      document.getElementById('status').innerHTML = '❌ Enlace inválido. Falta el código o el turno.';
      throw new Error('Missing parameters');
    }
    const TURNO = parseInt(TURNO_STR);
    const INICIO_MELODIA = new Date(Date.UTC(2027, 2, 14, 0, 0, 0)).getTime();
    function getSegundoGlobal() { return Math.floor((Date.now() - INICIO_MELODIA) / 1000); }
    function enTurno() { const ahora = getSegundoGlobal(); return ahora >= TURNO && ahora < TURNO + 300; }

    const TOKEN_URL = null;   // Pon tu URL del worker cuando la tengas
    const LIVEKIT_URL = null; // Pon tu URL de LiveKit cuando la tengas

    let room = null;
    let localStream = null;

    async function solicitarToken() {
      if (!TOKEN_URL) throw new Error('Token URL no configurada');
      const roomName = `turno-${TURNO}`;
      const res = await fetch(`${TOKEN_URL}?room=${roomName}&identity=${CODIGO}`);
      if (!res.ok) throw new Error('Error al obtener token');
      const data = await res.json();
      return data.token;
    }

    async function iniciarTransmision() {
      if (!enTurno()) {
        document.getElementById('status').innerHTML = '⏳ Aún no es tu turno. Espera unos minutos y recarga la página.';
        return;
      }
      if (!localStream) {
        try {
          localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
          document.getElementById('localVideo').srcObject = localStream;
        } catch(err) {
          document.getElementById('status').innerHTML = '❌ Error al acceder a cámara o micrófono.';
          return;
        }
      }
      if (!TOKEN_URL || !LIVEKIT_URL) {
        document.getElementById('status').innerHTML = '⚠️ El sistema de vídeo no está configurado aún. Si es tu turno, avisa al administrador.';
        return;
      }
      try {
        const token = await solicitarToken();
        room = new Livekit.Room();
        await room.connect(LIVEKIT_URL, token);
        await room.localParticipant.publishTracks(localStream.getTracks());
        document.getElementById('status').innerHTML = '🎙️ Estás al aire. Tu actuación durará 5 minutos.';
        setTimeout(() => desconectar(), 300000);
      } catch(err) {
        console.error(err);
        document.getElementById('status').innerHTML = '❌ Error de conexión. Inténtalo de nuevo.';
      }
    }

    async function desconectar() {
      if (room) await room.disconnect();
      room = null;
      document.getElementById('status').innerHTML = 'Turno finalizado. Gracias por participar.';
    }

    document.getElementById('btnStart').addEventListener('click', iniciarTransmision);
    if (enTurno()) {
      document.getElementById('status').innerHTML = '✅ Estás en tu turno. Pulsa el botón para empezar a transmitir.';
    } else {
      const segundosRestantes = TURNO - getSegundoGlobal();
      document.getElementById('status').innerHTML = `⏳ Tu turno comienza en ${segundosRestantes} segundos. Mantén esta página abierta.`;
    }
  </script>
</body>
</html>
