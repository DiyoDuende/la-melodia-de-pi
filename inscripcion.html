<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta property="og:title" content="Inscripción - La melodía de π">
  <meta property="og:description" content="Inscríbete para participar en La melodía de π, una obra musical colaborativa e infinita">

</head>
<body>
<div class="container form-inscripcion-container">
  <div class="header-top" style="justify-content: space-between;">
    <div class="logo" data-i18n="titulo">La melodía de π</div>
    <div class="language-selector">
      <button class="lang-btn activo" data-lang="es">🇪🇸 Español</button>
      <button class="lang-btn" data-lang="en">🇬🇧 English</button>
      <button class="lang-btn" data-lang="fr">🇫🇷 Français</button>
      <button class="lang-btn" data-lang="de">🇩🇪 Deutsch</button>
      <button class="lang-btn" data-lang="it">🇮🇹 Italiano</button>
      <button class="lang-btn" data-lang="pt">🇵🇹 Português</button>
      <button class="lang-btn" data-lang="ja">🇯🇵 日本語</button>
      <button class="lang-btn" data-lang="zh">🇨🇳 中文</button>
      <button class="lang-btn" data-lang="ar">🇸🇦 العربية</button>
    </div>
  </div>
  <h1 data-i18n="inscripcion_titulo">📝 Inscripción</h1>
  <form id="formInscripcion">
    <input type="text" id="nombre" data-i18n="nombre" placeholder="Nombre completo" required>
    <input type="email" id="email" data-i18n="email" placeholder="Correo electrónico" required>
    <input type="text" id="ubicacion" data-i18n="ubicacion" placeholder="País / Ciudad">
    <textarea id="bio" data-i18n="presentacion" placeholder="Presentación (opcional)"></textarea>
    <label><input type="checkbox" id="acepto" required> <span data-i18n="acepto">Acepto las normas de respeto y educación</span></label>
    <button type="submit" data-i18n="enviar">🎶 Enviar inscripción</button>
  </form>
  <div id="respuesta" class="info-box" style="display:none;"></div>

  <!-- MENÚ AÑADIDO -->
  <div class="menu">
    <a class="menu-item" href="que-es.html" data-i18n="que_es_menu">📖 Qué es</a>
