<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="inscripcion_titulo">Inscripción - La melodía de π</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
<div class="container" style="max-width:700px;">
  <div class="header-top" style="justify-content: space-between;">
    <div class="logo" data-i18n="titulo">La melodía de π</div>
    <div class="language-selector">
      <button class="lang-btn activo" data-lang="es">🇪🇸 Español</button>
      <button class="lang-btn" data-lang="en">🇬🇧 English</button>
      <button class="lang-btn" data-lang="fr">🇫🇷 Français</button>
      <button class="lang-btn" data-lang="de">🇩🇪 Deutsch</button>
      <button class="lang-btn" data-lang="it">🇮🇹 Italiano</button>
      <button class="lang-btn" data-lang="pt">🇵🇹 Português</button>
      <button class="lang-btn" data-lang="ja">🇯🇵 日本語</button>
      <button class="lang-btn" data-lang="zh">🇨🇳 中文</button>
      <button class="lang-btn" data-lang="ar">🇸🇦 العربية</button>
    </div>
  </div>
  <h1 data-i18n="inscripcion_titulo">📝 Inscripción</h1>
  <form id="formInscripcion">
    <input type="text" id="nombre" data-i18n="nombre" placeholder="Nombre completo" required>
    <input type="email" id="email" data-i18n="email" placeholder="Correo electrónico" required>
    <input type="text" id="ubicacion" data-i18n="ubicacion" placeholder="País / Ciudad">
    <textarea id="bio" data-i18n="presentacion" placeholder="Presentación (opcional)"></textarea>
    <label><input type="checkbox" id="acepto" required> <span data-i18n="acepto">Acepto las normas de respeto y educación</span></label>
    <button type="submit" data-i18n="enviar">🎶 Enviar inscripción</button>
  </form>
  <div id="respuesta" class="info-box" style="display:none;"></div>
  <a href="index.html" data-i18n="volver">← Volver</a>
</div>
<script src="script.js"></script>
<script>
  // ============================================================
  // 1. CONFIGURACIÓN (cambia esta URL cuando tengas tu Apps Script)
  // ============================================================
  const API_URL = null; // 👈 Pon aquí la URL de tu Apps Script (terminada en /exec)

  // ============================================================
  // 2. GENERADOR DE π (para el PDF)
  // ============================================================
  function* generarPi() {
    let q = 1n, r = 0n, t = 1n, k = 1n, n = 3n, l = 3n;
    while (true) {
      if (4n*q + r - t < n*t) {
        yield Number(n);
        let nr = 10n*(r - n*t);
        n = (10n*(3n*q + r))/t - 10n*n;
        q = 10n*q;
        r = nr;
      } else {
        let nr = (2n*q + r)*l;
        let nn = (q*(7n*k) + 2n + r*l)/(t*l);
        q = q*k;
        t = t*l;
        l = l + 2n;
        k = k + 1n;
        n = nn;
        r = nr;
      }
    }
  }

  const NOTAS = {
    '0': 'Mi⁸', '1': 'Do', '2': 'Re', '3': 'Mi', '4': 'Fa',
    '5': 'Sol', '6': 'La', '7': 'Si', '8': 'Do⁸', '9': 'Re⁸'
  };

  function generarPDF(nombre, codigo, inicioSegundo, turnoUTC, turnoLocal) {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    const gen = generarPi();
    const cache = [];
    function getDigito(pos) {
      while (cache.length <= pos) cache.push(gen.next().value.toString());
      return cache[pos];
    }

    doc.setFontSize(16);
    doc.text("La melodía de π", 20, 20);
    doc.setFontSize(10);
    doc.text(`Intérprete: ${nombre}`, 20, 30);
    doc.text(`Código: ${codigo}`, 20, 36);
    doc.text(`Inicio (UTC): ${turnoUTC}`, 20, 42);
    doc.text(`Inicio (local): ${turnoLocal}`, 20, 48);
    doc.text("Tus 300 notas (5 minutos):", 20, 58);

    let y = 68;
    let linea = '';
    for (let i = 0; i < 300; i++) {
      const digito = getDigito(inicioSegundo + i);
      const nota = NOTAS[digito] || '·';
      linea += `${digito}(${nota}) `;
      if ((i + 1) % 15 === 0 || i === 299) {
        doc.text(linea, 20, y);
        linea = '';
        y += 8;
        if (y > 280) { doc.addPage(); y = 20; }
      }
    }
    doc.save(`pi-${codigo}.pdf`);
  }

  // ============================================================
  // 3. ENVÍO DEL FORMULARIO
  // ============================================================
  document.getElementById('formInscripcion').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector('button');
    btn.disabled = true;
    btn.textContent = 'Enviando...';

    const nombre = document.getElementById('nombre').value;
    const email = document.getElementById('email').value;
    const ubicacion = document.getElementById('ubicacion').value || 'No especificado';
    const bio = document.getElementById('bio').value || '';
    const codigo = 'π-' + Math.random().toString(36).substring(2, 10).toUpperCase();

    if (!API_URL) {
      alert('⚠️ El servidor de inscripciones no está configurado aún.\nPor favor, contacta con el administrador.');
      btn.disabled = false;
      btn.textContent = '🎶 Enviar inscripción';
      return;
    }

    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({ nombre, email, lugar: ubicacion, instrumento: bio, codigo, grabacion: 'no' })
      });
      const data = await res.json();
      if (data.success) {
        const turnoUTC = new Date(data.inicioSegundo * 1000).toUTCString();
        const turnoLocal = new Date(data.inicioSegundo * 1000).toLocaleString();
        generarPDF(nombre, codigo, data.inicioSegundo, turnoUTC, turnoLocal);

        const respuestaDiv = document.getElementById('respuesta');
        respuestaDiv.style.display = 'block';
        respuestaDiv.innerHTML = `
          <h3>✅ Inscripción completada</h3>
          <p><strong>${nombre}</strong></p>
          <p>🎼 Código: <strong style="color:#ffd966">${codigo}</strong></p>
          <p>⏱️ Turno #${Math.floor(data.inicioSegundo / 300) + 1}</p>
          <p>🌍 Hora UTC: ${turnoUTC}</p>
          <p>🌍 Hora local: ${turnoLocal}</p>
          <p>π empezará en el segundo global <strong>${data.inicioSegundo}</strong></p>
          <p><a href="interprete.html?code=${codigo}&turno=${data.inicioSegundo}" target="_blank" style="color:#ffd966;">👉 Entrar como intérprete</a></p>
          <p style="font-size:.9rem; opacity:.7">Tu PDF se ha descargado. Guarda este código.</p>
        `;
        document.getElementById('formInscripcion').reset();
      } else {
        alert('Error al inscribirte: ' + (data.error || 'Inténtalo más tarde.'));
      }
    } catch (err) {
      console.error(err);
      alert('Error de conexión. Inténtalo de nuevo.');
    } finally {
      btn.disabled = false;
      btn.textContent = '🎶 Enviar inscripción';
    }
  });
</script>
</body>
</html>
